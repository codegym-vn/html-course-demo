<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex container: flex-wrap và align-content</title>
  <meta name="description" content="Xuống dòng với flex-wrap và phân bổ các dòng flex theo trục phụ với align-content. Vẽ và đếm flex line trực tiếp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    @utility opt {
      @apply rounded border border-slate-800 bg-slate-900 px-1 py-1 font-mono text-[0.74rem] text-slate-300 cursor-pointer transition-colors hover:border-slate-600 aria-pressed:border-sky-400 aria-pressed:bg-sky-400/10 aria-pressed:text-sky-300;
    }
    @utility card {
      @apply rounded-lg border border-slate-800 bg-slate-950/60 p-2.5;
    }
    @utility card-title {
      @apply mb-1.5 text-xs font-bold uppercase tracking-wider text-slate-500;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="font-sans bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen overflow-hidden">
  <div class="app w-full max-w-[980px] flex flex-col bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">

    <header class="h-11 shrink-0 flex items-center justify-between px-4 bg-slate-950/70 border-b border-slate-800">
      <h1 class="text-[0.95rem] font-bold tracking-tight">
        Xuống dòng trong Flexbox
        <span class="ml-2 text-xs font-medium text-slate-500">flex-wrap · align-content</span>
      </h1>
      <button type="button" id="btnReset"
        class="text-xs font-semibold text-slate-400 border border-slate-700 rounded-md px-2.5 py-1 hover:bg-slate-800 hover:text-slate-100 transition-colors cursor-pointer">
        Reset
      </button>
    </header>

    <main class="flex-1 min-h-0 grid grid-cols-[300px_1fr] overflow-hidden">

      <!-- Cột trái: điều khiển -->
      <section class="min-h-0 overflow-y-auto p-3 flex flex-col gap-2 border-r border-slate-800">

        <div class="card">
          <p class="card-title"><code class="font-mono normal-case text-sky-400">flex-wrap</code></p>
          <div class="grid grid-cols-3 gap-1" role="group" aria-label="flex-wrap">
            <button type="button" class="opt" data-key="wrap" data-val="nowrap" aria-pressed="false">nowrap</button>
            <button type="button" class="opt" data-key="wrap" data-val="wrap" aria-pressed="true">wrap</button>
            <button type="button" class="opt" data-key="wrap" data-val="wrap-reverse" aria-pressed="false">wrap-reverse</button>
          </div>
        </div>

        <div id="acCard" class="card transition-opacity data-[inactive=true]:opacity-45">
          <p class="card-title flex justify-between"><code class="font-mono normal-case text-sky-400">align-content</code><span id="acStatus" class="normal-case tracking-normal font-semibold text-emerald-400">đang có tác dụng</span></p>
          <div class="grid grid-cols-3 gap-1" role="group" aria-label="align-content">
            <button type="button" class="opt" data-key="ac" data-val="normal" aria-pressed="true">normal</button>
            <button type="button" class="opt" data-key="ac" data-val="flex-start" aria-pressed="false">flex-start</button>
            <button type="button" class="opt" data-key="ac" data-val="center" aria-pressed="false">center</button>
            <button type="button" class="opt" data-key="ac" data-val="flex-end" aria-pressed="false">flex-end</button>
            <button type="button" class="opt" data-key="ac" data-val="space-between" aria-pressed="false">space-between</button>
            <button type="button" class="opt" data-key="ac" data-val="space-around" aria-pressed="false">space-around</button>
          </div>
        </div>

        <div class="card flex flex-col gap-2">
          <label class="flex flex-col gap-1" for="rangeWidth">
            <span class="flex items-center justify-between text-[0.8rem]">
              <span class="text-slate-300">Chiều rộng container</span>
              <span id="widthBadge" class="font-mono text-[0.75rem] font-bold text-sky-300 bg-sky-400/10 rounded px-1.5">100%</span>
            </span>
            <input type="range" id="rangeWidth" min="30" max="100" value="100" class="w-full accent-sky-400 cursor-pointer">
          </label>
          <label class="flex flex-col gap-1" for="rangeCount">
            <span class="flex items-center justify-between text-[0.8rem]">
              <span class="text-slate-300">Số item</span>
              <span id="countBadge" class="font-mono text-[0.75rem] font-bold text-sky-300 bg-sky-400/10 rounded px-1.5">8</span>
            </span>
            <input type="range" id="rangeCount" min="2" max="14" value="8" class="w-full accent-sky-400 cursor-pointer">
          </label>
        </div>

        <div class="card flex flex-col gap-1">
          <p class="card-title mb-0.5">Đo trên trình duyệt</p>
          <dl class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-[0.78rem]">
            <dt class="text-slate-500">Số dòng flex</dt>
            <dd id="mLines" class="font-mono font-semibold text-amber-300">-</dd>
            <dt class="text-slate-500">Rộng mỗi item</dt>
            <dd id="mWidth" class="font-mono font-semibold text-slate-200">-</dd>
          </dl>
          <p id="explain" class="mt-1 text-[0.76rem] leading-snug text-slate-400"></p>
        </div>
      </section>

      <!-- Cột phải -->
      <section class="min-h-0 p-3 flex flex-col gap-2.5 overflow-hidden bg-slate-950">
        <div class="flex-1 min-h-0 flex flex-col gap-2 rounded-lg border border-slate-800 bg-slate-900 p-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">.container</span>
            <span class="flex items-center gap-1.5 text-[0.72rem] text-slate-400"><span class="inline-block h-2.5 w-4 rounded-sm border border-dashed border-amber-400 bg-amber-400/15"></span>dòng flex (flex line)</span>
          </div>
          <div class="flex-1 min-h-0">
            <!-- Container: display flex, chiều cao cố định theo khung để thấy align-content -->
            <div id="container" class="relative h-full rounded-md border-2 border-dashed border-slate-600 bg-slate-950 p-1.5 gap-1.5">
              <div id="lineLayer" class="pointer-events-none absolute inset-0" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <div class="shrink-0 rounded-lg border border-slate-800 bg-slate-900 px-3 py-2">
          <div class="mb-1 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">CSS đang áp dụng</span>
            <button type="button" id="btnCopy"
              class="rounded border border-sky-400/60 px-2 py-0.5 text-[0.72rem] font-semibold text-sky-300 hover:bg-sky-400 hover:text-slate-950 transition-colors cursor-pointer">Copy</button>
          </div>
          <pre id="codeOutput" class="font-mono text-[0.8rem] leading-snug text-slate-300 overflow-x-auto"></pre>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
